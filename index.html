<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Киіз үй — юрта: прошлое, настоящее, будущее</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--tx:#14262e;--mu:#4c6670;--ac:#0a8fa8;--go:#d9a021;--card:#fff;--ln:#cfdad8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1d24;--tx:#e6efef;--mu:#9fb8bf;--ac:#4cc9e0;--go:#f0b93a;--card:#142a33;--ln:#254049}}
:root[data-theme="dark"]{--bg:#0d1d24;--tx:#e6efef;--mu:#9fb8bf;--ac:#4cc9e0;--go:#f0b93a;--card:#142a33;--ln:#254049}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.6 "Noto Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Noto Serif",Georgia,serif;line-height:1.15;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font:700 22px "Noto Serif",Georgia,serif;color:var(--tx)}
.lang{display:flex;border:1.5px solid var(--ln);border-radius:99px;overflow:hidden}
.lang button{border:0;background:none;color:var(--tx);padding:7px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,.hot:focus-visible{outline:3px solid var(--go);outline-offset:2px}
h1{font-size:clamp(34px,6vw,60px);max-width:14ch;margin-top:10px}
.lead{max-width:56ch;color:var(--mu);margin:16px 0 26px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 22px;font:600 16px "Noto Sans",system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s}
.tabs button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.hero{display:grid;gap:24px;grid-template-columns:1fr;align-items:start}
@media(min-width:900px){.hero{grid-template-columns:1.25fr 1fr}}
.scene{border-radius:20px;overflow:hidden;line-height:0;border:1.5px solid var(--ln)}
.scene svg{width:100%;height:auto}
.scene{--s1:#5fc3dc;--s2:#d6f1f7;--felt:#f4f6f4;--orn:#0a8fa8;--gr:#8bb26b;--sun:#ffe27a;--door:#2f5864}
.scene.past{--s1:#e9a95c;--s2:#f8e2b6;--felt:#d8c7a0;--orn:#8a4b2a;--gr:#b79b66;--sun:#fff0b0;--door:#5a3a22}
.scene.future{--s1:#0a1030;--s2:#2b4a8a;--felt:rgba(190,240,250,.55);--orn:#7cf0ff;--gr:#17363c;--sun:#e9f3ff;--door:#0a2a40}
.scene svg *{transition:fill .5s,stroke .5s}
.scene .felt{fill:var(--felt);stroke:var(--orn);stroke-width:2}
.scene.future .felt{filter:drop-shadow(0 0 8px #7cf0ff)}
.po,.no,.fu{display:none}
.past .po,.now .no,.future .fu{display:block}
.smoke path{animation:sm 4s ease-in infinite;opacity:0}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
.stars circle{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.smoke path,.stars circle{animation:none;opacity:.7}}
.panel{background:var(--card);border:1.5px solid var(--ln);border-radius:20px;padding:26px}
.panel h2{font-size:26px;margin-bottom:12px}
.panel ul{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.panel li{padding-left:18px;position:relative}
.panel li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:8px;border-radius:50%;background:var(--go)}
section{padding:64px 0 0}
section h2{font-size:clamp(26px,4vw,38px)}
.sub{color:var(--mu);margin:8px 0 24px;max-width:60ch}
.build{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:900px){.build{grid-template-columns:1.2fr 1fr}}
.bsvg{background:var(--card);border:1.5px solid var(--ln);border-radius:20px;padding:12px;line-height:0}
.bsvg svg{width:100%;height:auto}
.bsvg g{transition:opacity .45s}
.hot{cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ac);margin:8px 0 14px}
.steps{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.sbox{min-height:130px}
.sbox h3{font-size:24px;margin-bottom:8px}
.quiz{display:grid;gap:16px}
.q{background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:20px}
.q p{margin:0 0 12px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1.5px solid var(--ln);background:none;color:var(--tx);border-radius:10px;padding:8px 16px;font:400 16px "Noto Sans",system-ui,sans-serif;cursor:pointer}
.opts button.ok{background:#1f9d55;border-color:#1f9d55;color:#fff}
.opts button.no{background:#c0392b;border-color:#c0392b;color:#fff}
.opts button:disabled{cursor:default}
.score{display:flex;gap:16px;align-items:center;margin-top:4px;font-weight:600}
.reset{border:1.5px solid var(--ln);background:none;color:var(--tx);border-radius:10px;padding:8px 16px;font:600 15px "Noto Sans",system-ui,sans-serif;cursor:pointer}
.by{color:var(--mu);font-size:15px;margin:-12px 0 22px;white-space:pre-line}
footer div{white-space:pre-line}
.orn{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:900px){.orn{grid-template-columns:1.2fr 1fr}}
.lab{font-weight:600;margin:16px 0 8px}.lab:first-child{margin-top:0}
.mot{display:flex;flex-wrap:wrap;gap:8px}
.mot button{border:1.5px solid var(--ln);background:none;color:var(--tx);border-radius:10px;padding:7px 14px;font:400 15px "Noto Sans",system-ui,sans-serif;cursor:pointer}
.mot button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sw{display:flex;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--ln);cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--tx)}
#odesc{margin:16px 0 0}
footer{margin-top:72px;padding:28px 0;border-top:1.5px solid var(--ln);color:var(--mu);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">Киіз үй</div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="ru" aria-pressed="true">RU</button>
    <button data-l="kk" aria-pressed="false">ҚАЗ</button>
  </div>
</header>

<main>
<h1 data-i="h1"></h1>
<p class="lead" data-i="lead"></p>
<p class="by" data-i="auth"></p>
<div class="tabs" role="group">
  <button data-e="past" aria-pressed="false"></button>
  <button data-e="now" aria-pressed="true"></button>
  <button data-e="future" aria-pressed="false"></button>
</div>

<div class="hero">
  <div class="scene now" id="scene">
    <svg viewBox="0 0 600 320" role="img" aria-label="Yurt">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--s1)"/><stop offset="1" style="stop-color:var(--s2)"/></linearGradient></defs>
      <rect width="600" height="320" fill="url(#sk)"/>

    </svg>
  </div>
  <div class="panel" id="panel" aria-live="polite"></div>
</div>

<section>
  <h2 data-i="bh"></h2>
  <p class="sub" data-i="bs"></p>
  <div class="build">
    <div class="bsvg">
      <svg viewBox="0 0 400 240" role="img" aria-label="Yurt assembly">
        <defs><pattern id="lat" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0L20 20M20 0L0 20" stroke="#9a6b3a" stroke-width="3"/></pattern></defs>
        <path d="M20 212H380" stroke="var(--mu)" stroke-width="2"/>

        <g id="g4" class="hot" tabindex="0" data-n="4"><path d="M60 212V140Q200 20 340 140V212Z" fill="#e9e3d2" stroke="#8c7d5a" stroke-width="3"/><path d="M60 156H340" stroke="#0a8fa8" stroke-width="6" stroke-dasharray="9 7"/><circle cx="200" cy="80" r="16" fill="#2f5864"/><rect x="174" y="168" width="52" height="44" rx="3" fill="#6b4423"/></g>
        <g id="g3" class="hot" tabindex="0" data-n="3"><circle cx="200" cy="80" r="22" fill="none" stroke="#6b4423" stroke-width="6"/><path d="M178 80h44M200 58v44" stroke="#6b4423" stroke-width="3"/></g>

    </div>
    <div>
      <input type="range" id="rng" min="1" max="4" step="1" value="4" aria-label="Step">

      <div class="sbox" id="sbox" aria-live="polite"></div>
    </div>
  </div>
</section>

<section>
  <h2 data-i="qh"></h2>
  <p class="sub" data-i="qs"></p>
  <div class="quiz" id="quiz"></div>
  <div class="score"><span id="score"></span><button class="reset" id="reset"></button></div>
</section>

<section>
  <h2 data-i="oh"></h2>
  <p class="sub" data-i="os"></p>
  <div class="orn">
    <div class="bsvg">
      <svg viewBox="0 0 400 160" role="img" aria-label="Ornament">
        <defs>
          <g id="m0"><path fill="none" stroke-width="3" stroke-linecap="round" d="M20 20C20 8 6 8 6 18C6 27 17 27 17 20M20 20C20 8 34 8 34 18C34 27 23 27 23 20M20 20V36"/></g>
          <g id="m1"><path fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M3 30Q11 4 20 24Q29 4 37 30M3 36H37"/></g>
          <g id="m2"><path fill="none" stroke-width="2.5" stroke-linejoin="round" d="M13 4L19.9 8V16L13 20L6.1 16V8ZM27 4L33.9 8V16L27 20L20.1 16V8ZM20 17L26.9 21V29L20 33L13.1 29V21Z"/></g>
          <g id="m3"><path fill="none" stroke-width="3" stroke-linejoin="round" d="M20 4L36 34H4Z"/><circle cx="20" cy="25" r="3.5" stroke="none"/></g>
          <g id="m4"><circle cx="20" cy="20" r="14" fill="none" stroke-width="3"/><path fill="none" stroke-width="3" stroke-linecap="round" d="M20 6V34M6 20H34"/></g>
        </defs>
        <rect x="20" y="6" width="360" height="148" rx="8" fill="#efe9d8"/>
        <g id="orow"></g>
      </svg>
    </div>
    <div class="panel">
      <div class="lab" data-i="lm"></div><div class="mot" id="mots"></div>
      <div class="lab" data-i="lc"></div><div class="sw" id="sws"></div>
      <div class="lab"><span data-i="lr"></span><span id="rv"></span></div>
      <input type="range" id="orng" min="3" max="10" step="1" value="6" aria-label="Repeats">
      <p id="odesc" aria-live="polite"></p>
    </div>
  </div>
</section>
</main>

<footer><div data-i="foot"></div><div data-i="auth"></div></footer>
</div>

past:{h:"Дом, который ехал вместе с семьёй",p:"Тысячелетиями кочевники степи жили в юртах. Деревянный каркас обтягивали войлоком из овечьей шерсти: летом внутри прохладно, зимой тепло. Семья собирала юрту за один-два часа, а разбирала и увозила на верблюде или телеге.",f:["Сборка: 1–2 часа","Перевозка: верблюды и телеги","Очаг в центре, дым уходит через тундык"]},
